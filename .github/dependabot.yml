version: 2

# Private SilverAssist Composer packages are `vcs` repositories on GitHub.
# Once those repositories are private (WEB-1194), Dependabot needs a token to
# read them. COMPOSER_GITHUB_TOKEN is a Dependabot secret holding a token with
# read access to the SilverAssist repositories.
registries:
  silverassist-github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.COMPOSER_GITHUB_TOKEN}}

updates:
  # GitHub Actions dependency updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    open-pull-requests-limit: 10
    
    # Group all GitHub Actions updates together
    groups:
      github-actions-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Composer dependency updates
  - package-ecosystem: "composer"
    directory: "/"
    registries:
      - silverassist-github
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    labels:
      - "dependencies"
      - "composer"
      - "automated"
    open-pull-requests-limit: 10
    
    # Group composer updates by type
    groups:
      composer-dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      composer-production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # npm dependency updates (design system end-to-end tooling only)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 5
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
